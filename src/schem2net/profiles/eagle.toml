# Eagle's schematic colours: the classic palette and the one of Eagle 9.
# Names, values, pin names and pad numbers share one colour, so their roles
# come from where they sit.

[colors]
wire = [[0, 128, 0], [13, 171, 118]]
symbol = [[128, 0, 0], [201, 13, 12]]  # parts, pins and supply symbols
# Names and values, pin names, labels; some boards give text layers black.
field = [[128, 128, 128], [80, 80, 80], [0, 0, 0]]
pin_number = [[128, 128, 128], [80, 80, 80], [0, 0, 0], [128, 0, 0], [201, 13, 12]]  # pads

[order]
names_by_layer = true  # drawn layer by layer: names among names, values among values
designators_in_pin_colour = true  # Eagle 9 writes designators in the symbol red
designators_outside = true  # >NAME sits outside the box; texts inside are pin names

[wires]
grid = [2.54, 1.27, 0.635]  # mm, standard first; pages printed to fit are scaled back by it

[text]
font = "eagle"  # text drawn as strokes in Eagle's vector font, or as filled outlines

[labels]
span_pages = true  # nets with one name are one net on every sheet
in_outlines = true  # a name in an outline that meets a wire is a net label
on_wires = true  # so is one laid along a wire, just above it
sheet_reference = true  # cross-reference labels add the sheet the net goes on to, "/2.3B"

[power]
unnamed_ground = "GND"  # supply symbols whose name is hidden
ground_stems = true  # GND's stem, ending on the wire, reads as a pin

[pins]
max_width = 0.6  # mm
min_length = 0.5  # mm
numbers_above = true  # pad numbers sit above horizontal pins
at_body_edge = true  # many symbols draw no pin line; wires end on the outline
name_gap = 2.6  # mm; pin names sit well inside the outline
library = "eagle"  # pads of unnumbered pins, once Eagle libraries are indexed
diode_names = ["C", "A"]  # diode packages name their pads for the cathode and anode
