# KiCad's default schematic colour theme.
# Parts marked "do not populate" are drawn in grey.

[colors]
wire = [[0, 150, 0]]
bus = [[0, 0, 132]]
symbol = [[132, 0, 0], [156, 155, 152], [161, 161, 161]]
field = [[0, 100, 100], [147, 147, 145], [152, 152, 152]]
pin_number = [[169, 0, 0], [165, 164, 162], [170, 170, 170]]
local_label = [[15, 15, 15]]
global_label = [[132, 0, 0]]
hier_label = [[114, 86, 0]]
sheet_pin = [[0, 100, 100]]
note = [[0, 0, 194]]  # free text and drawing lines

[sheets]
file_prefix = "File:"  # below each sheet symbol, in the hierarchical label colour
path_prefix = "Sheet:"  # in the title block of every page

[power]
not_nets = ["PWR_FLAG"]  # drawn like a power symbol, but joins nothing by name
unnamed_ground = "GND"  # ground symbols whose name is hidden

[order]
fields_follow_symbol = true  # each symbol's text is drawn right after its graphics
designator_first = true  # the reference comes before the value
wires_drawn_together = true  # all wires in one run, whatever their net class colour

[pins]
max_width = 0.2   # mm; thicker lines are body graphics
min_length = 0.5  # mm
numbers_above = true  # above horizontal pins, left of vertical ones
library = "kicad"  # numbers of hidden and stacked pins, once KiCad's symbols are indexed

[wires]
grid = [1.27, 0.635, 0.254]  # mm, standard first; pages printed to fit are scaled back by it
