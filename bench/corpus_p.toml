# Corpus P: an exploratory pilot of the source-verified evaluation, November 2026.
# Owners new to every earlier set (bench/discovery_p.json lists what was turned away).
# Development evidence only: never an independent result. Only references are stored.
# `schem2net verify-corpus p` admits designs; `schem2net evaluate p OUT` reads them.
# Renderings use KiCad images made as schem2net-kicad:10.0.6 is, from kicad/kicad:7.0
# and :8.0: printf 'FROM kicad/kicad:8.0\nENV HOME=/tmp\nWORKDIR /work\nENTRYPOINT ["kicad-cli"]\n'
#   | docker build -t schem2net-kicad:8.0 -

tier = "exploratory"
test_share = 0.0
holdout_share = 0.0

