[project]
name = "schem2net"
dynamic = ["version"]
description = "Recover netlists from vector schematic PDFs."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Rza Mirzayev" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pypdfium2>=5",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/rzadevv/schem2net"

[project.scripts]
schem2net = "schem2net.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/schem2net/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
