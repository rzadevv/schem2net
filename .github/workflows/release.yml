name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no token is stored
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make test
      - run: uv build
      - run: test "v$(uv run schem2net --version | cut -d' ' -f2)" = "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
