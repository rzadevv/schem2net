name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make lint
      - run: make test

  bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        corpus: [a, e]  # E needs no Docker: its PDFs and sources are on GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - id: cache
        uses: actions/cache@v4
        with:
          path: bench/build
          key: corpus-${{ matrix.corpus }}-${{ hashFiles(format('bench/corpus_{0}.toml', matrix.corpus), 'docker/Dockerfile.kicad') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: make ${{ matrix.corpus == 'a' && 'corpus' || 'corpus-e' }}
      - run: uv run schem2net bench ${{ matrix.corpus }} --split dev --json bench-dev.json
      - run: uv run schem2net bench-compare bench/baseline_${{ matrix.corpus }}_dev.json bench-dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-dev-${{ matrix.corpus }}
          path: bench-dev.json
