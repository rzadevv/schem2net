name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly: property tests at many examples

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'quick' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra mcp --python ${{ matrix.python }}
      - run: make lint
      - run: make package-check

  gui:
    runs-on: ubuntu-latest
    env:
      SCHEM2NET_GUI_TESTS: "1"  # fail, rather than skip, when Qt cannot load
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # What Qt and its web view load that a bare Ubuntu 24.04 lacks
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2t64 libbrotli1 libdbus-1-3 libegl1 libexpat1 libfontconfig1 libfreetype6
          libgbm1 libgl1 libglib2.0-0t64 libgssapi-krb5-2 libnss3 libx11-6 libxcb-dri3-0
          libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxkbfile1
          libxrandr2 libxtst6
      - run: uv sync --locked --extra gui
      - run: uv run --extra gui pytest tests/test_gui.py --cov=schem2net.gui --cov-config=/dev/null

  bench:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        corpus: [a, e]  # E needs no Docker: its PDFs and sources are on GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - id: cache
        uses: actions/cache@v4
        with:
          path: bench/build
          key: corpus-${{ matrix.corpus }}-${{ hashFiles(format('bench/corpus_{0}.toml', matrix.corpus), 'docker/Dockerfile.kicad') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: make ${{ matrix.corpus == 'a' && 'corpus' || 'corpus-e' }}
      - run: uv run schem2net bench ${{ matrix.corpus }} --split dev --json bench-dev.json
      - run: uv run schem2net bench-compare bench/baseline_${{ matrix.corpus }}_dev.json bench-dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-dev-${{ matrix.corpus }}
          path: bench-dev.json
